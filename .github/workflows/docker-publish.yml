name: docker-publish

# Builds and publishes every service image to Docker Hub. Runs only on a
# version tag push (e.g. v2.0.0) — deliberate releases, not every commit.
#
# Requires two repo secrets (Settings -> Secrets and variables -> Actions),
# set by a human in GitHub's UI — this workflow never receives them any
# other way and nothing in the repo ever holds real Docker Hub credentials:
#   DOCKERHUB_USERNAME  — Docker Hub username (karthickdk02)
#   DOCKERHUB_TOKEN     — Docker Hub access token (Account Settings ->
#                          Security -> New Access Token; NOT your password)

on:
  push:
    tags:
      - "v*"

env:
  DOCKERHUB_NAMESPACE: karthickdk02

jobs:
  build-and-push:
    name: Build & push ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - automation-service
          - edge-proxy
          - frontend
          - identity-service
          - inventory-service
          - metrics-service
          - recording-service
          - terminal-service
          - zabbix-integration-service
    steps:
      - uses: actions/checkout@v7

      - name: Resolve version tag
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@v7
        with:
          context: ./core
          file: ./core/services/${{ matrix.service }}/Dockerfile
          # Every service is multi-arch, frontend included. Its Dockerfile pins
          # the Vite/esbuild compile to $BUILDPLATFORM so it runs natively
          # instead of under QEMU arm64 (where esbuild dies with SIGILL); only
          # the nginx runtime layer is cross-built, and the bundle it serves is
          # static. Publishing frontend as amd64-only made the whole release
          # undeployable on ARM64 hosts even though the other ten images were fine.
          platforms: linux/amd64,linux/arm64
          # Only the frontend reads this (baked into the Vite bundle as VITE_APP_VERSION
          # for the sidebar's release-version display) — harmless no-op build-arg for
          # every other service's Dockerfile, which doesn't declare ARG APP_VERSION.
          build-args: |
            APP_VERSION=${{ steps.ver.outputs.version }}
          push: true
          # :latest only follows a stable release. A pre-release tag
          # (v2.0.0-beta, -rc1, …) publishes its own version tag and leaves
          # :latest pointing at the last stable one — otherwise every default
          # `docker pull` silently moves to pre-release code.
          tags: |
            ${{ env.DOCKERHUB_NAMESPACE }}/seyalrun-${{ matrix.service }}:${{ steps.ver.outputs.version }}
            ${{ !contains(steps.ver.outputs.version, '-') && format('{0}/seyalrun-{1}:latest', env.DOCKERHUB_NAMESPACE, matrix.service) || '' }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
