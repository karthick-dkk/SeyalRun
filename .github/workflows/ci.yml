name: ci

# One run per change:
#   * push to main / release/** — the branches that ship;
#   * pull_request — everything else, tested once as the PR (not again as a push);
#   * workflow_call — docker-publish.yml runs this as the gate before any image
#     is pushed, so a tag no longer re-runs it as a separate, non-blocking push.
on:
  push:
    branches: [main, "release/**"]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  # Superseded pushes to a PR are cancelled; main/release runs always finish.
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unit-tests:
    name: Unit + security-invariant tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: core/tests/requirements-test.txt
      - uses: actions/setup-node@v7
        with:
          node-version: "24"   # test_terminal_connect_provenance runs a JS module under node
      - run: pip install -r core/tests/requirements-test.txt
      - run: pytest -q -rs

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: core/services/frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"   # same major as the frontend Dockerfile's build stage
          cache: npm
          cache-dependency-path: core/services/frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  deploy-config:
    name: Compose + shell scripts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Every compose combination renders; Redis fails closed
        run: bash .github/scripts/check-compose.sh
      - name: shellcheck (installer + ops)
        run: shellcheck -x -S warning install.sh ops/*.sh .github/scripts/*.sh
