---
# Internal transport encryption — risk register R-1.
#
#   ops/gen-internal-tls.sh
#   INTERNAL_TLS_DIR=$(pwd)/tls/internal docker compose \
#     -f docker-compose.yml -f docker-compose.internal-tls.yml up -d
#
# An overlay rather than a change to docker-compose.yml so it is opt-in and
# reversible: without it the stack behaves exactly as before, and a deployment
# can adopt this without a flag-day cutover.
#
# No application code changes are needed for this, which is why it is a compose
# overlay at all:
#   * uvicorn reads UVICORN_SSL_KEYFILE / UVICORN_SSL_CERTFILE from the
#     environment, so every service serves HTTPS without touching a Dockerfile.
#   * httpx honours SSL_CERT_FILE, so all 52 client call sites trust the internal
#     CA without being edited. The bundle carries the public roots too, so
#     outbound calls to S3 / Elasticsearch / webhooks keep validating normally.
#   * Peer URLs move to https:// here; each service reads them from the
#     environment, overriding its config.py default.
#
# This is one-way TLS. Client authentication is already carried by the signed
# X-Service-Token on every internal endpoint; what was missing was
# confidentiality on the wire.

services:

  identity-service:
    environment:
      UVICORN_SSL_CERTFILE: /etc/seyalrun/tls/server.pem
      UVICORN_SSL_KEYFILE: /etc/seyalrun/tls/server-key.pem
      SSL_CERT_FILE: /etc/seyalrun/tls/ca-bundle.pem
      INVENTORY_SERVICE_URL: https://inventory-service:8102
      AUTOMATION_SERVICE_URL: https://automation-service:8105
      TERMINAL_SERVICE_URL: https://terminal-service:8103
    volumes:
      - ${INTERNAL_TLS_DIR}/identity-service.pem:/etc/seyalrun/tls/server.pem:ro
      - ${INTERNAL_TLS_DIR}/identity-service-key.pem:/etc/seyalrun/tls/server-key.pem:ro
      - ${INTERNAL_TLS_DIR}/ca-bundle.pem:/etc/seyalrun/tls/ca-bundle.pem:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('https://localhost:8101/health')"]

  inventory-service:
    environment:
      UVICORN_SSL_CERTFILE: /etc/seyalrun/tls/server.pem
      UVICORN_SSL_KEYFILE: /etc/seyalrun/tls/server-key.pem
