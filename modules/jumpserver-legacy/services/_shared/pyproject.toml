[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pravesh-shared"
version = "0.1.0"
description = "Shared library for all Pravesh sidecar services"
requires-python = ">=3.12"
dependencies = [
    "structlog>=24.0.0",
    "prometheus-client>=0.20.0",
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "tenacity>=8.3.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "python-multipart>=0.0.31",
]

[project.optional-dependencies]
vault = ["hvac>=2.3.0"]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.23.0", "anyio>=4.0.0"]

[tool.hatch.build.targets.wheel]
packages = ["pravesh_shared"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "S", "UP", "B", "A"]
ignore = ["S101"]  # assert in tests

[tool.mypy]
python_version = "3.12"
strict = true
