[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zbx-sync"
version = "0.1.0"
description = "Pravesh sidecar — bidirectional Zabbix ↔ JumpServer asset sync"
requires-python = ">=3.12"
dependencies = [
    "pravesh-shared",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    "redis[asyncio]>=5.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]
