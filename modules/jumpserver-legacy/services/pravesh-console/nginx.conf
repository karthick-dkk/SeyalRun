server {
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/javascript;

    # API proxy → playbook-studio (before SPA catch-all)
    location /api/ {
        proxy_pass http://ps_service:8005;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    # WebSocket proxy → playbook-studio (job streams + SSH terminals)
    location /ws/ {
        proxy_pass http://ps_service:8005;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Static file cache by extension (JS/CSS chunks from Vite)
    # This matches individual files like /assets/index-xxx.js — NOT the bare /assets/ path
    location ~* \.(js|css|woff2?|png|svg|ico|webp|ttf|map)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA catch-all — serve index.html for ALL Vue Router routes including /assets/
    # Use only $uri (not $uri/) to avoid matching the real dist/assets/ directory → 403
    location / {
        try_files $uri /index.html;
    }
}
