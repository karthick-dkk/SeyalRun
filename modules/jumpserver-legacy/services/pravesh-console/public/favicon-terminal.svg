<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Dark terminal screen -->
  <rect width="32" height="32" rx="5" fill="#010409"/>
  <!-- Screen border -->
  <rect x="1" y="1" width="30" height="30" rx="4.5" fill="none" stroke="#3fb950" stroke-width="1.5"/>
  <!-- Prompt arrow > -->
  <text x="5" y="20" font-family="'JetBrains Mono',monospace,sans-serif" font-size="13"
        font-weight="700" fill="#3fb950">&#x3e;_</text>
  <!-- Blinking cursor dot -->
  <rect x="24" y="14" width="5" height="8" rx="1" fill="#58a6ff" opacity="0.9"/>
</svg>
