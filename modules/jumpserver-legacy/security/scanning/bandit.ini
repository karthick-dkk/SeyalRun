[bandit]
# Skip test files
exclude_dirs = tests,venv,.venv

# Tests to skip (with rationale):
# B101: assert statements — acceptable in tests
# B404: import subprocess — we use it intentionally in ansible_runner
# B603: subprocess without shell=True — safe, we validate inputs
skips = B101,B404,B603

# Severity threshold — only flag MEDIUM and above
# (LOW findings are noise in a lab environment, revisit for production)
severity = medium

# Confidence threshold
confidence = medium
