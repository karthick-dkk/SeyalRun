name: Weekly Security Scan

on:
  schedule:
    - cron: "0 2 * * 0"   # Sunday 02:00 UTC
  workflow_dispatch:

jobs:
  dependency-scan:
    name: Dependency Scan — ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - automation-bridge
          - zbx-sync
          - launch-token
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          pip install safety pip-audit
          pip install -e services/${{ matrix.service }}

      - name: Safety check
        run: safety check --full-report
        continue-on-error: true

      - name: pip-audit
        run: pip-audit --requirement services/${{ matrix.service }}/requirements.txt
        continue-on-error: true

  trivy-full:
    name: Trivy Full Scan — ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - automation-bridge
          - zbx-sync
          - launch-token
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t pravesh/${{ matrix.service }}:weekly services/${{ matrix.service }}

      - name: Trivy scan (all severities)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: pravesh/${{ matrix.service }}:weekly
          format: table
          exit-code: "0"
          severity: CRITICAL,HIGH,MEDIUM
