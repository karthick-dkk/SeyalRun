---
# FreeIPA Server — Docker Compose (ARM64 compatible)
# Run AFTER compose.sidecars.yml creates the pravesh_net network
# Deploy: docker compose -f compose.freeipa.yml up -d

services:
  freeipa:
    image: freeipa/freeipa-server:fedora-41
    container_name: freeipa
    platform: linux/arm64
    hostname: ipa.lab.pravesh.local
    restart: unless-stopped
    environment:
      IPA_SERVER_INSTALL_OPTS: >-
        --domain=lab.pravesh.local
        --realm=LAB.PRAVESH.LOCAL
        --ds-password=${IPA_DM_PASSWORD}
        --admin-password=${IPA_ADMIN_PASSWORD}
        --mkhomedir
        --no-ntp
        --unattended
    volumes:
      - freeipa_data:/data
      - /sys/fs/cgroup:/sys/fs/cgroup:ro
    ports:
      - "389:389"       # LDAP (plaintext — only for internal Docker network)
      - "636:636"       # LDAPS (TLS — use this from JumpServer)
      - "88:88/tcp"     # Kerberos
      - "88:88/udp"
      - "464:464/tcp"   # kpasswd
      - "464:464/udp"
    tmpfs:
      - /run
      - /tmp
    security_opt:
      - seccomp:unconfined   # FreeIPA requires this for SSSD/NSS
    cap_add:
      - SYS_TIME
      - NET_ADMIN
    sysctls:
      net.ipv6.conf.all.disable_ipv6: "1"
    networks:
      - pravesh_net
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "ipa", "user-find", "admin", "--all"]
      interval: 60s
      timeout: 30s
      retries: 10
      start_period: 300s   # FreeIPA takes 3-5 minutes to initialize

networks:
  pravesh_net:
    external: true
    name: jms_net

volumes:
  freeipa_data:
    driver: local
    driver_opts:
      type: none
      device: /data/freeipa
      o: bind
