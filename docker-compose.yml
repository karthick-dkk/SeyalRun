# SeyalRun v2.0 — Phase 1 stack.
#
# By default, identity-service and inventory-service connect to your
# existing bare-metal PostgreSQL/MySQL via DB_HOST/DB_PORT/DB_ENGINE in .env
# (e.g. DB_HOST=192.168.64.x or host.docker.internal). If you don't have a
# bare-metal DB, additionally apply docker-compose.db.yml:
#
#   docker compose -f docker-compose.yml -f docker-compose.db.yml --profile postgres-db up -d
#
# edge-proxy is the only host-published service (TLS on EDGE_HTTPS_PORT).
# identity-service, inventory-service, and api-gateway are internal-only.

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # AOF persistence so rate-limit, webhook-dedup, and login-lockout counters
    # survive a restart (an attacker can't reset lockout by bouncing redis).
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec",
              "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD is not set in .env - run ops/ensure-redis-password.sh or re-run install.sh}"]
    # Sessions, JIT-elevation flags and lockout counters live here, so any
    # container on the network could read or forge them without auth (F-4).
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:-}
    # The image entrypoint starts as root, chowns /data and drops to the redis
    # user, so it keeps exactly the three capabilities that needs.
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID]
    security_opt: ["no-new-privileges:true"]
    networks: [seyalrun_net]
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - seyalrun_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 5

  identity-service:
    build:
      context: ./core
      dockerfile: services/identity-service/Dockerfile
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    env_file: .env
    extra_hosts: ["host.docker.internal:host-gateway"]
    networks: [seyalrun_net]
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - seyalrun_logs:/var/log/seyalrun
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8101/health')"]
      interval: 30s
      timeout: 5s
      retries: 5

  inventory-service:
    build:
      context: ./core
      dockerfile: services/inventory-service/Dockerfile
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    env_file: .env
    extra_hosts: ["host.docker.internal:host-gateway"]
    networks: [seyalrun_net]
    volumes:
      - seyalrun_logs:/var/log/seyalrun
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8102/health')"]
      interval: 30s
      timeout: 5s
      retries: 5

  terminal-service:
    build:
      context: ./core
      dockerfile: services/terminal-service/Dockerfile
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    env_file: .env
    extra_hosts: ["host.docker.internal:host-gateway"]
    networks: [seyalrun_net]
    volumes:
      - seyalrun_logs:/var/log/seyalrun
    read_only: true
    tmpfs:
      - /tmp
    depends_on:
      identity-service:
        condition: service_healthy
      inventory-service:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8103/health')"]
      interval: 30s
      timeout: 5s
      retries: 5

  recording-service:
    build:
      context: ./core
      dockerfile: services/recording-service/Dockerfile
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    env_file: .env
    extra_hosts: ["host.docker.internal:host-gateway"]
    networks: [seyalrun_net]
    volumes:
      - seyalrun_logs:/var/log/seyalrun
    read_only: true
    tmpfs:
      - /tmp
    depends_on:
      identity-service:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8104/health')"]
      interval: 30s
      timeout: 5s
      retries: 5

  api-gateway:
    build:
      context: ./core
      dockerfile: services/api-gateway/Dockerfile
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    env_file: .env
    networks: [seyalrun_net]
    volumes:
      - seyalrun_logs:/var/log/seyalrun
    read_only: true
    tmpfs:
      - /tmp
    depends_on:
      identity-service:
        condition: service_healthy
      inventory-service:
        condition: service_healthy
      terminal-service:
        condition: service_healthy
      recording-service:
        condition: service_healthy
      automation-service:
        condition: service_healthy
      zabbix-integration-service:
        condition: service_healthy
      metrics-service:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./core
      dockerfile: services/frontend/Dockerfile
      # Without this the Dockerfile's own `ARG APP_VERSION=dev` default wins and
      # the sidebar reads "vdev" in every source-built deployment — including
      # staging, and anything installed via install.sh. "Which version is this?"
      # is not a cosmetic question on a system that has to produce audit evidence.
      args:
        APP_VERSION: ${SEYALRUN_VERSION:-dev}
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [seyalrun_net]
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 5

  edge-proxy:
    build:
      context: ./core
      dockerfile: services/edge-proxy/Dockerfile
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    # CSP frame-ancestors is always 'self' plus these EXTRA origins (default none).
    # Set FRAME_ANCESTORS in .env to the Zabbix origin (e.g. https://zabbix.example.com,
    # unquoted host source) to allow the embedded dashboard to iframe this app. Never "*".
    environment:
      FRAME_ANCESTORS: ${FRAME_ANCESTORS:-}
      # Upstream scheme and verification, substituted into the nginx template.
      # They must always be defined: envsubst replaces an unset variable with an
      # empty string, which would produce "://upstream" and fail to start.
      # docker-compose.internal-tls.yml flips these to https / on.
      INTERNAL_PROTO: ${INTERNAL_PROTO:-http}
      INTERNAL_PROXY_SSL_VERIFY: ${INTERNAL_PROXY_SSL_VERIFY:-off}
      # Port the HTTP->HTTPS redirect points at. Must track the host side of the
      # 8443 mapping below, or plain-HTTP visitors are redirected to a dead port.
      PUBLIC_HTTPS_PORT: ${EDGE_HTTPS_PORT:-8443}
    networks: [seyalrun_net]
    # NOT read_only: the nginx entrypoint renders the CSP template into
    # /etc/nginx/conf.d at boot (envsubst), which needs a writable conf.d owned by
    # the unprivileged nginx user. A root-owned tmpfs there isn't writable by uid 101.
    # The container still runs as the non-root nginx user (nginx-unprivileged image).
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    ports:
      - "${EDGE_HTTP_PORT:-8080}:8080"
      - "${EDGE_HTTPS_PORT:-8443}:8443"
    volumes:
      - ${TLS_CERT_PATH}:/etc/nginx/ssl/cert.pem:ro
      - ${TLS_KEY_PATH}:/etc/nginx/ssl/key.pem:ro
    depends_on:
      api-gateway:
        condition: service_healthy
      frontend:
        condition: service_healthy
      zabbix-integration-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 5

  automation-service:
    build:
      context: ./core
      dockerfile: services/automation-service/Dockerfile
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    env_file: .env
    extra_hosts: ["host.docker.internal:host-gateway"]
    networks: [seyalrun_net]
    volumes:
      - seyalrun_logs:/var/log/seyalrun
    read_only: true
    tmpfs:
      - /tmp
      - /playbooks
    depends_on:
      identity-service:
        condition: service_healthy
      inventory-service:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8105/health')"]
      interval: 30s
      timeout: 5s
      retries: 5

  zabbix-integration-service:
    build:
      context: ./core
      dockerfile: services/zabbix-integration-service/Dockerfile
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    env_file: .env
    extra_hosts: ["host.docker.internal:host-gateway"]
    networks: [seyalrun_net]
    volumes:
      - seyalrun_logs:/var/log/seyalrun
    read_only: true
    tmpfs:
      - /tmp
    depends_on:
      automation-service:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8106/health')"]
      interval: 30s
      timeout: 5s
      retries: 5

  metrics-service:
    build:
      context: ./core
      dockerfile: services/metrics-service/Dockerfile
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    env_file: .env
    extra_hosts: ["host.docker.internal:host-gateway"]
    networks: [seyalrun_net]
    volumes:
      - seyalrun_logs:/var/log/seyalrun
    read_only: true
    tmpfs:
      - /tmp
    depends_on:
      automation-service:
        condition: service_healthy
      inventory-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8107/health')"]
      interval: 30s
      timeout: 5s
      retries: 5

  # SeyalRun 3.0 posture: host facts (via automation-service's fixed facts job)
  # and signed offline vulnerability-feed snapshots. Own DB: POSTURE_DB_NAME.
  posture-service:
    build:
      context: ./core
      dockerfile: services/posture-service/Dockerfile
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    env_file: .env
    environment:
      # Upload spool on the data volume: the root fs is read-only and /tmp is RAM.
      TMPDIR: /var/lib/seyalrun/posture/uploads
      # Findings page warns when the active feed is older than this (days).
      POSTURE_FEED_STALE_DAYS: ${POSTURE_FEED_STALE_DAYS:-7}
    extra_hosts: ["host.docker.internal:host-gateway"]
    networks: [seyalrun_net]
    volumes:
      - seyalrun_logs:/var/log/seyalrun
      - seyalrun_posture_data:/var/lib/seyalrun/posture
    read_only: true
    tmpfs:
      - /tmp
    depends_on:
      identity-service:
        condition: service_healthy
      inventory-service:
        condition: service_healthy
      automation-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8108/health')"]
      interval: 30s
      timeout: 5s
      retries: 5

  # MCP server for AI agents. Present in every deployment mode so the /mcp route
  # edge-proxy already publishes has an upstream here too, not only in prod.
  mcp-server:
    build:
      context: ./core
      dockerfile: services/mcp-server/Dockerfile
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [seyalrun_net]
    read_only: true
    tmpfs:
      - /tmp
    environment:
      GATEWAY_URL: "http://api-gateway:8000"
    depends_on:
      api-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8110/health')"]
      interval: 30s
      timeout: 5s
      retries: 5

networks:
  seyalrun_net:
    driver: bridge

volumes:
  seyalrun_logs:
  seyalrun_redis_data:
  seyalrun_posture_data:
