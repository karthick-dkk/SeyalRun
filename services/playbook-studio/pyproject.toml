[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "playbook-studio"
version = "0.1.0"
description = "Pravesh sidecar — visual Ansible playbook builder, template library, and alerting"
requires-python = ">=3.12"
dependencies = [
    "pravesh-shared",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "slowapi>=0.1.9",
    "redis[asyncio]>=5.0.0",
    "httpx>=0.27.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "ruamel.yaml>=0.18.0",
    "aiosmtplib>=3.0.0",
    "tenacity>=8.3.0",
    "websockets>=12.0",
    "structlog>=24.0.0",
    "prometheus-client>=0.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "anyio[trio]>=4.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
timeout = 30
markers = [
    "unit: fast, no external dependencies",
    "integration: requires containers",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "S", "UP", "B"]
ignore = ["S101", "S603"]

[tool.mypy]
python_version = "3.12"
strict = true
