[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "automation-bridge"
version = "0.1.0"
description = "Pravesh sidecar — run Ansible and Salt-SSH jobs from JumpServer UI"
requires-python = ">=3.12"
dependencies = [
    "pravesh-shared",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "ansible-runner>=2.4.0",
    "slowapi>=0.1.9",
    "redis[asyncio]>=5.0.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "anyio[trio]>=4.0.0",
    "testcontainers[redis]>=4.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
timeout = 30
markers = [
    "unit: fast, no external dependencies",
    "integration: requires testcontainers",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "S", "UP", "B"]
ignore = ["S101", "S603", "S607"]

[tool.coverage.run]
source = ["app"]
omit = ["tests/*"]

[tool.mypy]
python_version = "3.12"
strict = true
